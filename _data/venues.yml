# Venue badges shown to the left of each publication.
# `color` sets the badge background; `url` makes the badge clickable.
#
# Papers still under review use the neutral "In review" badge. Once one is
# accepted, switch its `abbr` in _bibliography/papers.bib to the venue below.

"In review":
  color: "#6c757d"

"AAAI":
  url: https://aaai.org/conference/aaai/
  color: "#1c4587"

"JMLR":
  url: https://www.jmlr.org/
  color: "#2e7d32"

"IEEE JAS":
  url: https://www.ieee-jas.net/
  color: "#00629b"
